<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart - Fruitkha</title>

<link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/all.min.css">

<style>
  body { background:#f4f4f4; }
  .cart-box { margin-top:50px; }
  .product-img { width:70px; height:70px; object-fit:cover; border-radius:8px; }
  .qty-btn {
    width:28px;
    height:28px;
    border:none;
    background:#ddd;
    cursor:pointer;
  }
  .remove {
    color:red;
    cursor:pointer;
    font-weight:bold;
  }
</style>
</head>

<body>

<div class="container cart-box">

  <h2 class="text-center mb-4">🛒 Your Shopping Cart</h2>

  <table class="table table-bordered text-center">
    <thead class="thead-dark">
      <tr>
        <th>Product</th>
        <th>Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="cart-items"></tbody>
  </table>

  <div class="text-right">
    <h4>Total: $<span id="grand-total">0</span></h4>

    <button class="btn btn-danger" onclick="clearCart()">Clear Cart</button>
    <a href="index.html" class="btn btn-success">Continue Shopping</a>
  </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("fruitkha_cart")) || [];

function saveCart() {
  localStorage.setItem("fruitkha_cart", JSON.stringify(cart));
}

function renderCart() {
  let container = document.getElementById("cart-items");
  let totalEl = document.getElementById("grand-total");

  container.innerHTML = "";

  let total = 0;

  if (cart.length === 0) {
    container.innerHTML = `
      <tr>
        <td colspan="6">Cart is empty</td>
      </tr>
    `;
    totalEl.innerText = 0;
    return;
  }

  cart.forEach((item, index) => {
    let itemTotal = item.price * item.qty;
    total += itemTotal;

    container.innerHTML += `
      <tr>
        <td><img src="${item.img}" class="product-img"></td>
        <td>${item.name}</td>
        <td>$${item.price}</td>
        <td>
          <button class="qty-btn" onclick="decrease(${index})">-</button>
          ${item.qty}
          <button class="qty-btn" onclick="increase(${index})">+</button>
        </td>
        <td>$${itemTotal.toFixed(2)}</td>
        <td><span class="remove" onclick="removeItem(${index})">X</span></td>
      </tr>
    `;
  });

  totalEl.innerText = total.toFixed(2);
}

function increase(i) {
  cart[i].qty++;
  saveCart();
  renderCart();
}

function decrease(i) {
  if (cart[i].qty > 1) {
    cart[i].qty--;
  } else {
    cart.splice(i, 1);
  }
  saveCart();
  renderCart();
}

function removeItem(i) {
  cart.splice(i, 1);
  saveCart();
  renderCart();
}

function clearCart() {
  cart = [];
  saveCart();
  renderCart();
}

renderCart();
</script>

</body>
</html>
